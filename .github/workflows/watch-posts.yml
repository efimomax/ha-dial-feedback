# Every 3 hours: new replies in the announcement threads (forums, Reddit) -> Telegram.
# Threads: monitor/topics.json. Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID;
# optional REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET (Reddit "script" app, read-only app token).
name: Watch announcement threads

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-posts
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check threads
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python3 monitor/watch_posts.py
      - name: Save seen replies
        run: |
          if [ -n "$(git status --porcelain monitor/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add monitor/state.json
            git commit -m "monitor: update seen replies"
            git push
          fi
